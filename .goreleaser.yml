version: 2
project_name: lazyansible

env:
  - CGO_ENABLED=0

builds:
  - id: lazyansible
    main: ./cmd/lazyansible
    binary: lazyansible
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/daviddwlee84/lazyansible/internal/buildinfo.Version={{ .Version }}
      - -X github.com/daviddwlee84/lazyansible/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/daviddwlee84/lazyansible/internal/buildinfo.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE, CHANGELOG.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

# Future manual releases target only this fork and start as drafts.
# The current GitHub workflow invokes `build --snapshot`, never `release`.
release:
  github:
    owner: daviddwlee84
    name: lazyansible
  draft: true
  prerelease: auto
