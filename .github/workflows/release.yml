# Local-trial stage: manual snapshot builds only. No tag-triggered publication.
name: Build snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: lazyansible-snapshot
          path: dist/
