name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit and race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/lazyansible ./cmd/lazyansible
      - name: Real terminal smoke with disposable fake Ansible
        run: python3 testdata/pty_smoke.py ./bin/lazyansible

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/lazyansible
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publisher and independent source/module boundary tests
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - run: python3 -m unittest discover -s scripts -p test_distribution.py
      - run: python3 scripts/check-distribution.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,announce
      - name: Verify complete snapshot archives and native executable
        run: python3 scripts/release.py check --project lazyansible --binary lazyansible --smoke
